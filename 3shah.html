<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Anjoman&family=Lalezar&display=swap"
    rel="stylesheet"
  >

  <title>شمارش معکوس</title>

  <style>
    body {
      font-family: "Anjoman", Tahoma, Arial, sans-serif;
      background: #ffffff;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box-wrapper {
      position: relative;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 5vw;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 25px #e5d092;
      overflow: hidden;
    }

    .box-wrapper::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to top,
          rgba(255, 255, 255, 1),
          rgba(255, 255, 255, 0)
        ),
        url("https://uploadkon.ir/uploads/198621_26logo-bahareno-300x300.png")
        center / contain no-repeat;

      opacity: 0.9;
      z-index: 0;
      pointer-events: none;
    }

    .box-wrapper > * {
      position: relative;
      z-index: 1;
    }

    .countdown-flex {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5em;
      flex-wrap: wrap;
      margin-bottom: 1em;
      direction: ltr;
    }

    .time-box {
      /*
       * Default wrapper color.
       * The number automatically uses the same color.
       */
      --box-glow-color: 128, 128, 128;
      --number-glow-color: var(--box-glow-color);

      backdrop-filter: blur(3px) saturate(140%);
      -webkit-backdrop-filter: blur(3px) saturate(140%);

      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      padding: 0.6em 1em;
      min-width: 60px;
      flex: 1;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

      animation: boxGlow 1.75s ease-in-out infinite;
    }

    /*
     * Change these values to edit the wrapper colors.
     * The number shadows will automatically match them.
     */

    /* Day: gold */
    .day-box {
      --box-glow-color: 36, 189, 122;
    }

    /* Hour: green */
    .hour-box {
      --box-glow-color: 128, 128, 128;
    }

    /* Minute: gray */
    .minute-box {
      --box-glow-color: 128, 128, 128;
    }

    /* Second: red */
    .second-box {
      --box-glow-color: 255, 45, 45;
    }

    .time-box:hover {
      box-shadow:
        0 0 10px rgba(var(--box-glow-color), 0.8),
        0 0 25px rgba(var(--box-glow-color), 0.95);

      transform: scale(1.05);
    }

    .time-box .number {
      font-family: "Lalezar", cursive;
      font-size: 1.8em;
      font-weight: bold;
      display: block;

      animation:
        numberGlow 1.75s ease-in-out infinite;
    }

    .time-box .label {
      font-family: "Lalezar", cursive;
      font-size: 0.9em;
      font-weight: bold;
      opacity: 0.9;
    }

    /*
     * Number shadow animation.
     * It uses --number-glow-color.
     */
    @keyframes numberGlow {
      0%,
      100% {
        text-shadow:
          0 0 2px rgba(var(--number-glow-color), 0.7),
          0 0 4px rgba(var(--number-glow-color), 0.7),
          0 0 6px rgba(var(--number-glow-color), 0.7);
      }

      50% {
        text-shadow:
          0 0 5px rgba(var(--number-glow-color), 1),
          0 0 10px rgba(var(--number-glow-color), 0.9),
          0 0 15px rgba(var(--number-glow-color), 0.8),
          0 0 20px rgba(var(--number-glow-color), 0.7),
          0 0 25px rgba(var(--number-glow-color), 0.6);
      }
    }

    /*
     * Wrapper shadow animation.
     * It uses --box-glow-color.
     */
    @keyframes boxGlow {
      0%,
      100% {
        box-shadow:
          0 2px 8px rgba(var(--box-glow-color), 0.75);
      }

      25%,
      75% {
        box-shadow:
          0 4px 16px rgba(var(--box-glow-color), 0.85);
      }

      50% {
        box-shadow:
          0 6px 24px rgba(var(--box-glow-color), 1);
      }
    }

    @media (max-width: 480px) {
      .box-wrapper {
        padding: 30px 15px;
      }

      .time-box {
        min-width: 50px;
        padding: 0.5em;
      }

      .time-box .number {
        font-size: 1.5em;
      }
    }
  </style>
</head>

<body>
  <div class="box-wrapper">
    <div class="countdown-flex">

      <div class="time-box day-box">
        <span class="number" id="days">۰</span>
        <span class="label">روز</span>
      </div>

      <div class="time-box hour-box">
        <span class="number" id="hours">۰۰</span>
        <span class="label">ساعت</span>
      </div>

      <div class="time-box minute-box">
        <span class="number" id="minutes">۰۰</span>
        <span class="label">دقیقه</span>
      </div>

      <div class="time-box second-box">
        <span class="number" id="seconds">۰۰</span>
        <span class="label">ثانیه</span>
      </div>

    </div>
  </div>

  <script>
    function persianDigits(value) {
      const digits = {
        0: "۰",
        1: "۱",
        2: "۲",
        3: "۳",
        4: "۴",
        5: "۵",
        6: "۶",
        7: "۷",
        8: "۸",
        9: "۹"
      };

      return value
        .toString()
        .replace(/\d/g, digit => digits[digit]);
    }

    /*
     * Change this timestamp to set a new target date.
     */
    const targetTime = 1764603001000;

    const daysElement =
      document.getElementById("days");

    const hoursElement =
      document.getElementById("hours");

    const minutesElement =
      document.getElementById("minutes");

    const secondsElement =
      document.getElementById("seconds");

    function displayTime(days, hours, minutes, seconds) {
      daysElement.textContent =
        persianDigits(days);

      hoursElement.textContent =
        persianDigits(
          hours.toString().padStart(2, "0")
        );

      minutesElement.textContent =
        persianDigits(
          minutes.toString().padStart(2, "0")
        );

      secondsElement.textContent =
        persianDigits(
          seconds.toString().padStart(2, "0")
        );
    }

    function updateCountdown() {
      const remainingMilliseconds =
        targetTime - Date.now();

      if (remainingMilliseconds <= 0) {
        displayTime(0, 0, 0, 0);
        clearInterval(countdownInterval);
        return;
      }

      const totalSeconds =
        Math.floor(remainingMilliseconds / 1000);

      const days =
        Math.floor(totalSeconds / 86400);

      const hours =
        Math.floor((totalSeconds % 86400) / 3600);

      const minutes =
        Math.floor((totalSeconds % 3600) / 60);

      const seconds =
        totalSeconds % 60;

      displayTime(days, hours, minutes, seconds);
    }

    const countdownInterval =
      setInterval(updateCountdown, 1000);

    updateCountdown();
  </script>
</body>
</html>
